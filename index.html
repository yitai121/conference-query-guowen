    <title>参会资格查询 - 国文汇通</title>
    <style>
        /* ========== CSS变量 - 深蓝金色主题 ========== */
        :root {
            --bg-dark: #050510;
            --bg-card: rgba(15, 20, 40, 0.7);
            --glass-border: rgba(255, 215, 0, 0.15);
            --gold-primary: #FFD700;
            --gold-light: #FFE55C;
            --gold-dark: #B8860B;
            --blue-accent: #1E3A5F;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --success-green: #00E676;
            --error-red: #FF5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 硬件加速优化 ========== */
        html, body {
            height: 100%;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ========== 背景效果 - 极简 ========== */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(30, 58, 95, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
                var(--bg-dark);
            z-index: 0;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* ========== 主容器 ========== */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 玻璃卡片 ========== */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 215, 0, 0.05) inset;
        }

        /* 顶部金色装饰线 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 24px;
            right: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        /* ========== 标题区域 ========== */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.25);
            transform: translateZ(0);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header-sub {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ========== 输入区域 ========== */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            transform: translateZ(0);
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 14px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
            background: rgba(0, 0, 0, 0.4);
        }

        /* 输入图标 */
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }

        .input-field.with-icon {
            padding-left: 48px;
        }

        /* ========== 查询按钮 ========== */
        .btn-query {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #000;
            cursor: pointer;
            transition: all 0.2s ease;
            transform: translateZ(0);
            position: relative;
            overflow: hidden;
        }

        .btn-query::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-query:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 215, 0, 0.3);
        }

        .btn-query:hover::before {
            left: 100%;
        }

        .btn-query:active {
            transform: translateY(0);
        }

        /* ========== 结果区域 ========== */
        .result-container {
            margin-top: 24px;
            min-height: 120px;
        }

        /* 初始提示 */
        .result-hint {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .result-hint-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* ========== 结果卡片 - 通过 ========== */
        .result-pass {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.1), rgba(0, 230, 118, 0.05));
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 16px;
            padding: 28px 24px;
            animation: resultAppear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes resultAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-pass .result-status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .result-pass .status-icon {
            width: 48px;
            height: 48px;
            background: var(--success-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.4);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 230, 118, 0.4); }
            50% { box-shadow: 0 0 40px rgba(0, 230, 118, 0.6); }
        }

        .result-pass .status-text h3 {
            font-size: 20px;
            color: var(--success-green);
            margin-bottom: 4px;
        }

        .result-pass .status-text p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .result-pass .info-grid {
            display: grid;
            gap: 12px;
        }

        .result-pass .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .result-pass .info-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .result-pass .info-value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        /* ========== 结果卡片 - 未通过 ========== */
        .result-fail {
            background: rgba(255, 82, 82, 0.05);
            border: 1px solid rgba(255, 82, 82, 0.2);
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            animation: resultAppear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-fail .fail-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: rgba(255, 82, 82, 0.1);
            border: 2px solid var(--error-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .result-fail h3 {
            font-size: 18px;
            color: var(--error-red);
            margin-bottom: 8px;
        }

        .result-fail p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* ========== 底部信息 ========== */
        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }

        .footer p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .glass-card {
                padding: 32px 24px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header-icon {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
        }

        /* ========== 隐藏类 ========== */
        .hidden {
            display: none !important;
        }

        /* ========== 加载动画 ========== */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            color: var(--text-secondary);
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: var(--gold-primary);
            border-radius: 50%;
            animation: loadingBounce 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes loadingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>

        // ========== 构建O(1)查找哈希表 ==========
        const lookupTable = new Map();
        
        attendeeData.forEach(person => {
            // 姓名 - 统一转小写
            lookupTable.set(person.name.toLowerCase(), person);
            // 手机号 - 去掉所有非数字
            const phoneKey = person.phone.replace(/\D/g, '');
            lookupTable.set(phoneKey, person);
            // 邮箱 - 统一转小写
            lookupTable.set(person.email.toLowerCase(), person);
        });

        // ========== DOM元素 ==========
        const searchInput = document.getElementById('searchInput');
        const queryBtn = document.getElementById('queryBtn');
        const resultContainer = document.getElementById('resultContainer');

        // ========== 查询函数 ==========
        function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                searchInput.focus();
                return;
            }

            // 标准化查询词
            const normalizedQuery = query.toLowerCase();
            const phoneQuery = query.replace(/\D/g, '');

            let result = null;
            let matchType = '';

            // O(1) 哈希查找
            if (lookupTable.has(normalizedQuery)) {
                result = lookupTable.get(normalizedQuery);
                matchType = normalizedQuery.includes('@') ? '邮箱' : '姓名';
            } else if (phoneQuery && phoneQuery.length >= 7) {
                // 手机号模糊匹配
                for (const [key, person] of lookupTable) {
                    if (key === phoneQuery || key.endsWith(phoneQuery)) {
                        result = person;
                        matchType = '手机号';
                        break;
                    }
                }
            }

            // 渲染结果
            renderResult(result, matchType);
        }

        // ========== 渲染结果 ==========
        function renderResult(result, matchType) {
            if (result) {
                resultContainer.innerHTML = `
                    <div class="result-pass">
                        <div class="result-status">
                            <div class="status-icon">✓</div>
                            <div class="status-text">
                                <h3>恭喜！资格审核通过</h3>
                                <p>已通过 ${matchType} 查询匹配</p>
                            </div>
                        </div>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">姓名</span>
                                <span class="info-value">${result.name}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">手机号</span>
                                <span class="info-value">${result.phone}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">邮箱</span>
                                <span class="info-value">${result.email}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                resultContainer.innerHTML = `
                    <div class="result-fail">
                        <div class="fail-icon">✗</div>
                        <h3>未查询到相关信息</h3>
                        <p>请确认您输入的姓名、手机号或邮箱<br>是否与报名时填写的信息一致</p>
                    </div>
                `;
            }
        }

        // ========== 事件绑定 ==========
        queryBtn.addEventListener('click', performSearch);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // 回车即查 - 实时搜索
        searchInput.addEventListener('input', () => {
            if (searchInput.value.trim().length >= 2) {
                performSearch();
            }
        });

        // 自动聚焦
        window.addEventListener('load', () => {
            searchInput.focus();
        });
    </script>
